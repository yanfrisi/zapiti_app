name: zapiti_app
description: Prototipo simple del juego Zápiti en Flutter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/cards/
    - assets/menu/
    - assets/audio/
    - assets/characters/p1/front/
    - assets/characters/p1/left/
    - assets/characters/p1/right/
    - assets/characters/p2/front/
    - assets/characters/p2/left/
    - assets/characters/p2/right/
    - assets/characters/p3/front/
    - assets/characters/p3/left/
    - assets/characters/p3/right/
    - assets/characters/p4/front/
    - assets/characters/p4/left/
    - assets/characters/p4/right/
